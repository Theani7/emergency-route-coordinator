name: ambulance_coordination
description: AI-Driven Traffic Ambulance Coordination - Mobile App
publish_to: 'none'
version: 1.2.3+5

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  dio: ^5.7.0
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  web_socket_channel: ^3.0.1
  intl: ^0.19.0
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.5
  url_launcher: ^6.1.7
  google_fonts: ^8.2.1
  flutter_map_cache: ^1.5.2
  path_provider: ^2.1.6
  dio_cache_interceptor_hive_store: ^4.0.0
  hive: ^2.2.3
  dio_cache_interceptor: ^3.5.1
  connectivity_plus: ^7.3.1
  hive_flutter: ^1.1.0
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/app-icon.png
    - assets/google-icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app-icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#F8FAFC"
  image: "assets/app-icon.png"
  android: true
  ios: true
  android_12:
    image: "assets/app-icon.png"
    icon_background_color: "#F8FAFC"
    color: "#F8FAFC"
